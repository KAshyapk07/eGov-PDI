name: digit_dedup_engine
description: >
  Offline-capable beneficiary deduplication engine for DIGIT HCM.
  Uses phonetic algorithms (Soundex, Double Metaphone), string similarity
  (Jaro-Winkler, Levenshtein), GPS proximity scoring, and multi-attribute
  weighted matching to detect duplicate beneficiary registrations on mobile devices.
version: 0.0.1-dev
homepage: https://github.com/egovernments/DIGIT-Frontend/tree/PES-U/project-setup/PES-U/beneficiary-dedup-engine/flutter
repository: https://github.com/egovernments/DIGIT-Frontend

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
